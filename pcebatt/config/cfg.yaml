defaults:
  logger_level: &LOG_LEVEL ERROR

models:
  # ECM
  - class: GalerkinPCE
    module: pcebatt.models.submodels.ecm
    kwargs:
      logger_level: *LOG_LEVEL
  # OCV
  - class: qOCV_Differential
    module: pcebatt.models.submodels.ocv
    kwargs:
      logger_level: *LOG_LEVEL
      alpha: 0.5
  # HYSTERESIS
  - class: Plett_Hysteresis
    module: pcebatt.models.submodels.hysteresis
    kwargs:
      logger_level: *LOG_LEVEL
      g: 0.005


simulation:
  temperatures: [15, 25, 35, 45]

  paths:
    parameters:
      dist_folder: "../data/distributions"
      file_naming_scheme: "{temp}deg.parquet" # interpolators replace {temp} with temperatures and load files with the resulting names
      param_labels: ['mu_R0', 'sigma_R0', 'mu_tau1_inv', 'sigma_tau1_inv',
                    'mu_c1_inv', 'sigma_c1_inv', 'mu_tau2_inv', 'sigma_tau2_inv',
                    'mu_c2_inv', 'sigma_c2_inv'] # parameter names to read in from distribution files
    ocv:
      ocv_folder: "../data/measurements/qocv20"
      file_naming_scheme: 
        charge: qocv_{temp}deg_charge.parquet
        discharge: "qocv_{temp}deg_discharge.parquet"
      
    validation:
      validation_path: "../data/measurements/validation"
